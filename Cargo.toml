[package]
name = "plotwerk"
version = "0.1.0"
edition = "2024"
description = "Schneller Mathe-Rechner: Grafik, Geometrie, 3D, CAS, Wahrscheinlichkeit, Statistik und Pruefungsmodus"
license = "MIT"
repository = "https://github.com/Danny6769/plotwerk"

[workspace]
members = ["math"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
eframe = "0.33.3"
plotwerk-math = { path = "math" }
png = "0.17"
rfd = "0.15"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2
